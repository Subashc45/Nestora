<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us – Nestora</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="wrap page-title"><h1>Contact us</h1><p>Book a visit or ask a question. An advisor will respond within 24 hours.</p></div>
<section><div class="wrap cols2">
<form class="contact" id="contactForm" novalidate>
<label class="f">Your name<input id="name" autocomplete="name" required></label>
<label class="f">Email address<input id="email" type="email" autocomplete="email" required></label>
<label class="f">Phone (optional)<input id="phone" type="tel" autocomplete="tel"></label>
<label class="f">Message<textarea id="msg" rows="5" placeholder="Tell us what you are looking for"></textarea></label>
<button class="btn" type="submit">Request a callback</button>
<div class="note" id="note" role="status"></div>
</form>
<div class="panel"><h3>Visit our office</h3><p>12 Garden Street, Chennai 600001</p>
<h3 style="margin-top:18px">Call or write</h3><p>+91 90000 00000<br>hello@nestora.example</p>
<h3 style="margin-top:18px">Hours</h3><p>Monday to Saturday, 9:30 am to 6:30 pm</p></div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="script.js"></script>
</body>
</html>
