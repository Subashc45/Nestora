<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Properties – Nestora</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="wrap page-title"><h1>Properties</h1><p>Search by area, type, budget and bedrooms. Tap a heart to save a home, or open it for details.</p></div>
<section><div class="wrap">
<div class="filters">
<label class="f">City or area<input id="q" type="search" placeholder="Chennai, Kochi, Madurai…"></label>
<label class="f">Type<select id="type"><option value="">Any</option><option>Apartment</option><option>Villa</option><option>House</option><option>Plot</option></select></label>
<label class="f">Max budget<select id="budget"><option value="0">Any</option><option value="5000000">₹50 lakh</option><option value="10000000">₹1 crore</option><option value="20000000">₹2 crore</option><option value="40000000">₹4 crore</option></select></label>
<label class="f">Bedrooms<select id="beds"><option value="0">Any</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select></label>
<label class="f">Sort by<select id="sort"><option value="new">Newest</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option><option value="area">Largest area</option></select></label>
</div>
<p class="muted" id="count" aria-live="polite"></p>
<div class="grid" id="grid"></div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="script.js"></script>
</body>
</html>
